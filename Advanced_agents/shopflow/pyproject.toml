[project]
name = "shopflow-release-demo"
version = "0.1.0"
description = "Dummy release evidence APIs and a Streamlit simulator for learning"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "streamlit>=1.67,<2",
    "requests>=2.32,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "httpx2>=2,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
