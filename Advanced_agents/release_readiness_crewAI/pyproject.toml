[project]
name = "shopflow-release-readiness-crew"
version = "0.1.0"
description = "A four-agent hierarchical CrewAI release review with a Streamlit UI"
requires-python = ">=3.11,<3.14"
dependencies = [
    "crewai[litellm]>=1.15,<2",
    "streamlit>=1.67,<2",
    "python-dotenv>=1,<2",
    "httpx>=0.28,<1",
    "tiktoken>=0.8,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
