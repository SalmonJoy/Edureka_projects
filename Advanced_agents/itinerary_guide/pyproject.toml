[project]
name = "itinerary-guide"
version = "0.1.0"
description = "A beginner-friendly FastAPI and Streamlit travel demo"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "streamlit>=1.40,<2",
    "requests>=2.32,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
